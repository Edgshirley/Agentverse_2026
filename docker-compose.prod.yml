services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: spread-app-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/state"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
