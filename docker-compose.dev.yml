services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: spread-app-dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/api/state"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s

  seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    container_name: spread-seed-dev
    environment:
      - API_BASE_URL=http://app:5173
      - SEED_WAIT_TIMEOUT=60
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
